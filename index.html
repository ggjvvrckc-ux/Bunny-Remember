<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff1f7"><link rel="manifest" href="manifest.webmanifest"><title>Bunny Remember</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#fff7fb;color:#5b4652}
main{max-width:520px;margin:auto;padding:24px 18px 35px;text-align:center}.title{font-size:32px;font-weight:800}.sub{opacity:.75}
.card{background:white;border-radius:26px;padding:18px;margin:14px 0;box-shadow:0 6px 24px #e7bfd044}
.bunny{width:210px;height:210px;margin:8px auto}.bunny svg{width:100%;height:100%}
button{width:100%;border:0;border-radius:18px;padding:15px;margin:6px 0;font-size:17px;font-weight:700;background:#e58bb5;color:white}
button.alt{background:white;color:#b56b91;border:2px solid #efb8d0}.pause{background:transparent;color:#8c7180}
input[type=range]{width:100%;accent-color:#e58bb5}.stats{display:flex;gap:10px}.stat{flex:1;background:#fff0f6;border-radius:18px;padding:13px}.big{font-size:25px;font-weight:800}
#install{display:none;background:#c79ad6}.small{font-size:13px;opacity:.7}
</style></head><body><main>
<div class="title">Bunny Remember 🐰</div><div class="sub">Tu pequeña ayudita para acordarte 🌸</div>
<div class="bunny" id="bunny"></div>
<h2 id="message">¡Vamos a conseguirlo! 💗</h2>
<div class="card"><b id="intervalText">Recordarme cada 120 min</b><input id="interval" type="range" min="60" max="240" step="15" value="120"><div id="next">Sin recordatorio activo</div></div>
<button id="bath">🚽 He llegado al baño</button>
<button class="alt" id="wet">💦 Mojé el pañal</button>
<button id="install" onclick="installApp()">📱 Instalar Bunny Remember</button>
<div class="stats"><div class="stat">🚽<div class="big" id="bathCount">0</div><div>Baños conseguidos</div></div><div class="stat">💦<div class="big" id="wetCount">0</div><div>Pañales mojados</div></div></div>
<button class="pause" id="pause">🌙 Pausar recordatorio</button>
<div class="small">Los resultados se guardan en este dispositivo.</div>
</main>
<script>
const $=id=>document.getElementById(id);let timer=null,installPrompt=null;
let s=JSON.parse(localStorage.getItem("br_stats")||'{"bath":0,"wet":0}');
function bunny(happy=true){return `<svg viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
<ellipse cx="78" cy="45" rx="27" ry="62" fill="#ffd7e7"/><ellipse cx="142" cy="45" rx="27" ry="62" fill="#ffd7e7"/>
<ellipse cx="78" cy="47" rx="12" ry="43" fill="#fff0f7"/><ellipse cx="142" cy="47" rx="12" ry="43" fill="#fff0f7"/>
<circle cx="110" cy="125" r="72" fill="#ffd7e7"/><circle cx="85" cy="116" r="7" fill="#5b4652"/><circle cx="135" cy="116" r="7" fill="#5b4652"/>
<circle cx="68" cy="137" r="12" fill="#ffabc9"/><circle cx="152" cy="137" r="12" fill="#ffabc9"/><ellipse cx="110" cy="132" rx="8" ry="6" fill="#f28eae"/>
<path d="${happy?'M91 148 Q110 170 129 148':'M91 164 Q110 145 129 164'}" fill="none" stroke="#5b4652" stroke-width="5" stroke-linecap="round"/>
</svg>`}
function render(){ $("bathCount").textContent=s.bath;$("wetCount").textContent=s.wet;$("bunny").innerHTML=bunny(window.happy!==false)}
function setIntervalText(){let m=+$("interval").value;$("intervalText").textContent=`Recordarme cada ${m} min`}
$("interval").oninput=setIntervalText;
function schedule(){clearTimeout(timer);let m=+$("interval").value;localStorage.setItem("br_interval",m);$("next").textContent=`Siguiente aviso en ${m} min`;timer=setTimeout(()=>{notify();schedule()},m*60000)}
async function notify(){if("Notification"in window){if(Notification.permission==="default")await Notification.requestPermission();if(Notification.permission==="granted")new Notification("🐰 Bunny Remember",{body:"¡Pssst! Bunny dice que es hora de hacer una pausita para ir al baño 🌸"})}else alert("🐰 Pipi time 🌸 ¡Una pausita para ir al baño!")}
function result(type){if(type==="bath"){s.bath++;window.happy=true;$("message").textContent="¡Lo lograste! 🌸 Bunny está muy orgullosa de ti."}else{s.wet++;window.happy=false;$("message").textContent="No pasa nada 💗 Bunny sigue contigo. Lo intentamos otra vez."}localStorage.setItem("br_stats",JSON.stringify(s));render();schedule()}
$("bath").onclick=()=>result("bath");$("wet").onclick=()=>result("wet");$("pause").onclick=()=>{clearTimeout(timer);$("next").textContent="Recordatorio pausado 🌙"};
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installPrompt=e;$("install").style.display="block"});
async function installApp(){if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;$("install").style.display="none"}}
let saved=localStorage.getItem("br_interval");if(saved)$("interval").value=saved;setIntervalText();render();
</script></body></html>
