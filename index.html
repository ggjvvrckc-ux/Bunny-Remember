<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff1f7">
<link rel="manifest" href="manifest.webmanifest">
<title>Bunny Remember</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,-apple-system,sans-serif;
  background:#fff7fb;
  color:#5b4652
}

main{
  max-width:520px;
  margin:auto;
  padding:24px 18px 35px;
  text-align:center
}

.title{
  font-size:32px;
  font-weight:800
}

.sub{
  opacity:.75
}

.card{
  background:white;
  border-radius:26px;
  padding:18px;
  margin:14px 0;
  box-shadow:0 6px 24px #e7bfd044
}

/* Bunny 2D de cuerpo completo */
.bunny{
  width:210px;
  height:250px;
  margin:8px auto;
  display:flex;
  align-items:center;
  justify-content:center
}

.bunny img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block
}

.bunny-fallback{
  font-size:100px;
  line-height:1
}

button{
  width:100%;
  border:0;
  border-radius:18px;
  padding:15px;
  margin:6px 0;
  font-size:17px;
  font-weight:700;
  background:#e58bb5;
  color:white
}

button.alt{
  background:white;
  color:#b56b91;
  border:2px solid #efb8d0
}

.pause{
  background:transparent;
  color:#8c7180
}

input[type=range]{
  width:100%;
  accent-color:#e58bb5
}

.stats{
  display:flex;
  gap:10px
}

.stat{
  flex:1;
  background:#fff0f6;
  border-radius:18px;
  padding:13px
}

.big{
  font-size:25px;
  font-weight:800
}

#install{
  display:none;
  background:#c79ad6
}

.small{
  font-size:13px;
  opacity:.7
}

/* Selector de humedad */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#5b465255;
  align-items:center;
  justify-content:center;
  padding:18px;
  z-index:20
}

.modal.open{
  display:flex
}

.modal-card{
  position:relative;
  width:min(100%,420px);
  background:white;
  border-radius:28px;
  padding:24px 18px 20px;
  box-shadow:0 14px 50px #5b465233
}

.modal-card h2{
  margin:4px 30px 4px;
  font-size:25px
}

.modal-card .sub{
  margin:0 0 12px
}

.modal-close{
  position:absolute;
  right:12px;
  top:8px;
  width:42px;
  height:42px;
  margin:0;
  padding:0;
  background:transparent;
  color:#8c7180;
  font-size:30px
}

.wet-option{
  background:#fff0f6 !important;
  color:#9a5b7b !important;
  border:2px solid #efb8d0 !important
}
</style>
</head>

<body>

<main>

<div class="title">Bunny Remember 🐰</div>

<div class="sub">
Tu pequeña ayudita para acordarte 🌸
</div>

<div class="bunny" id="bunny"></div>

<h2 id="message">
¡Vamos a conseguirlo! 💗
</h2>

<div class="card">

<b id="intervalText">
Recordarme cada 120 min
</b>

<input
  id="interval"
  type="range"
  min="60"
  max="240"
  step="15"
  value="120"
>

<div id="next">
Sin recordatorio activo
</div>

</div>

<button id="bath">
🚽 He llegado al baño
</button>

<button class="alt" id="wet">
💦 Mojé el pañal
</button>

<button id="install" onclick="installApp()">
📱 Instalar Bunny Remember
</button>

<div class="stats">

<div class="stat">
🚽
<div class="big" id="bathCount">0</div>
<div>Baños conseguidos</div>
</div>

<div class="stat">
💦
<div class="big" id="wetCount">0</div>
<div>Pañales mojados</div>
</div>

</div>

<button class="pause" id="pause">
🌙 Pausar recordatorio
</button>

<div class="small">
Los resultados se guardan en este dispositivo.
</div>

</main>


<!-- VENTANA PARA ELEGIR CUÁNTO SE MOJÓ -->

<div class="modal" id="wetModal" aria-hidden="true">

<div
  class="modal-card"
  role="dialog"
  aria-modal="true"
  aria-labelledby="wetTitle"
>

<button
  class="modal-close"
  id="wetClose"
  aria-label="Cerrar"
>
×
</button>

<h2 id="wetTitle">
¿Cuánto se mojó? 💦
</h2>

<div class="sub">
Elige el nivel que corresponda.
</div>

<button
  class="wet-option"
  data-level="poco"
>
💧 Poco mojado
</button>

<button
  class="wet-option"
  data-level="algo"
>
💦 Algo mojado
</button>

<button
  class="wet-option"
  data-level="mucho"
>
💦💦 Muy mojado
</button>

<button
  class="wet-option"
  data-level="explotado"
>
💥 Ha explotado
</button>

</div>

</div>


<script>

const $=id=>document.getElementById(id);

let timer=null;
let installPrompt=null;


/* ESTADÍSTICAS */

let s=JSON.parse(
  localStorage.getItem("br_stats")
  ||
  '{"bath":0,"wet":0}'
);


/* ÚLTIMO NIVEL DE HUMEDAD */

let lastWet=
  localStorage.getItem("br_last_wet_level")
  ||
  "";


/* IMÁGENES DEL BUNNY */

const bunnyImages={

  normal:"images/bunny-normal.png",

  poco:"images/bunny-poco.png",

  algo:"images/bunny-algo.png",

  mucho:"images/bunny-mucho.png",

  explotado:"images/bunny-explotado.png"

};


/* MENSAJES */

const wetMessages={

  poco:
  "No pasa nada 💗 Bunny sigue contigo.",

  algo:
  "Un poquito más 💗 Seguimos.",

  mucho:
  "Ha sido bastante 💦 No pasa nada, seguimos.",

  explotado:
  "💥 ¡Ha explotado! No pasa nada, Bunny sigue contigo."

};


/* MOSTRAR BUNNY */

function bunnyImage(level){

  const src=
    bunnyImages[level]
    ||
    bunnyImages.normal;

  $("bunny").innerHTML="";

  const img=
    document.createElement("img");

  img.alt=
    "Bunny Remember";

  img.src=src;


  /* Si todavía no existe la imagen,
     mostramos un Bunny provisional */

  img.onerror=()=>{

    img.remove();

    const fallback=
      document.createElement("div");

    fallback.className=
      "bunny-fallback";

    fallback.textContent="🐰";

    $("bunny").appendChild(fallback);

  };


  $("bunny").appendChild(img);

}


/* ACTUALIZAR CONTADORES */

function render(){

  $("bathCount").textContent=
    s.bath;

  $("wetCount").textContent=
    s.wet;

  bunnyImage(
    lastWet || "normal"
  );

}


/* INTERVALO */

function setIntervalText(){

  let m=
    +$("interval").value;

  $("intervalText").textContent=
    `Recordarme cada ${m} min`;

}

$("interval").oninput=
  setIntervalText;


/* RECORDATORIOS */

function schedule(){

  clearTimeout(timer);

  let m=
    +$("interval").value;

  localStorage.setItem(
    "br_interval",
    m
  );

  $("next").textContent=
    `Siguiente aviso en ${m} min`;

  timer=
    setTimeout(
      ()=>{
        notify();
        schedule();
      },
      m*60000
    );

}


/* NOTIFICACIÓN */

async function notify(){

  if("Notification" in window){

    if(
      Notification.permission
      ===
      "default"
    ){

      await Notification.requestPermission();

    }

    if(
      Notification.permission
      ===
      "granted"
    ){

      new Notification(
        "🐰 Bunny Remember",
        {
          body:
          "¡Pssst! Bunny dice que es hora de hacer una pausita para ir al baño 🌸"
        }
      );

    }

  }else{

    alert(
      "🐰 Pipi time 🌸 ¡Una pausita para ir al baño!"
    );

  }

}


/* GUARDAR */

function saveStats(){

  localStorage.setItem(
    "br_stats",
    JSON.stringify(s)
  );

  localStorage.setItem(
    "br_last_wet_level",
    lastWet
  );

}


/* REGISTRAR BAÑO */

function registerBath(){

  s.bath++;

  lastWet="";

  localStorage.removeItem(
    "br_last_wet_level"
  );

  $("message").textContent=
    "¡Lo lograste! 🌸 Bunny está muy orgullosa de ti.";

  localStorage.setItem(
    "br_stats",
    JSON.stringify(s)
  );

  render();

  schedule();

}


/* ABRIR SELECTOR */

function openWetModal(){

  $("wetModal")
    .classList
    .add("open");

  $("wetModal")
    .setAttribute(
      "aria-hidden",
      "false"
    );

}


/* CERRAR SELECTOR */

function closeWetModal(){

  $("wetModal")
    .classList
    .remove("open");

  $("wetModal")
    .setAttribute(
      "aria-hidden",
      "true"
    );

}


/* REGISTRAR PAÑAL MOJADO */

function registerWet(level){

  s.wet++;

  lastWet=level;

  $("message").textContent=
    wetMessages[level];

  saveStats();

  closeWetModal();

  render();

  schedule();

}


/* BOTÓN BAÑO */

$("bath").onclick=
  registerBath;


/* BOTÓN MOJÉ EL PAÑAL */

$("wet").onclick=
  openWetModal;


/* CERRAR */

$("wetClose").onclick=
  closeWetModal;


/* OPCIONES */

document
  .querySelectorAll(".wet-option")
  .forEach(btn=>{

    btn.onclick=()=>{
      registerWet(
        btn.dataset.level
      );
    };

  });


/* CERRAR AL PULSAR FUERA */

$("wetModal")
  .addEventListener(
    "click",
    e=>{

      if(
        e.target===
        $("wetModal")
      ){

        closeWetModal();

      }

    }
  );


/* ESC */

document.addEventListener(
  "keydown",
  e=>{

    if(
      e.key==="Escape"
    ){

      closeWetModal();

    }

  }
);


/* PAUSAR RECORDATORIO */

$("pause").onclick=()=>{

  clearTimeout(timer);

  $("next").textContent=
    "Recordatorio pausado 🌙";

};


/* INSTALACIÓN PWA */

window.addEventListener(
  "beforeinstallprompt",
  e=>{

    e.preventDefault();

    installPrompt=e;

    $("install").style.display=
      "block";

  }
);


async function installApp(){

  if(installPrompt){

    installPrompt.prompt();

    await installPrompt.userChoice;

    installPrompt=null;

    $("install").style.display=
      "none";

  }

}


/* CARGAR CONFIGURACIÓN */

let saved=
  localStorage.getItem(
    "br_interval"
  );

if(saved){

  $("interval").value=
    saved;

}


/* INICIAR */

setIntervalText();

render();

</script>

</body>
</html>
